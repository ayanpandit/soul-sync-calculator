<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soul Sync Data Storage</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
    <style>
        /* Copying original styles to maintain UI consistency */
        :root {
            --primary: #FF9933;
            --secondary: #FF7722;
            --accent: #800080;
            --text-light: #FFF;
            --text-dark: #333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Sanskrit Text', 'Segoe UI', serif;
        }

        body {
            background: #000 url('/api/placeholder/2000/1000') center/cover fixed;
            color: var(--text-light);
            line-height: 1.6;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: -1;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .data-table {
            width: 100%;
            background: rgba(128, 0, 128, 0.2);
            border-radius: 15px;
            border: 2px solid #FF9933;
            margin-top: 2rem;
            overflow: hidden;
        }

        .data-table table {
            width: 100%;
            border-collapse: collapse;
            color: white;
        }

        .data-table th, .data-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid rgba(255, 153, 51, 0.3);
        }

        .data-table th {
            background: rgba(255, 153, 51, 0.2);
            color: #FF9933;
        }

        .data-table tr:hover {
            background: rgba(255, 153, 51, 0.1);
        }

        .controls {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
        }

        button {
            background: linear-gradient(45deg, #FF9933, #FF7722);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s;
        }

        button:hover {
            opacity: 0.9;
        }

        .header {
            text-align: center;
            padding: 2rem;
            background: rgba(128, 0, 128, 0.2);
            border-radius: 15px;
            border: 2px solid #FF9933;
        }

        .header h1 {
            color: #FF9933;
            margin-bottom: 1rem;
        }

        .no-data {
            text-align: center;
            padding: 2rem;
            color: #FF9933;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>॥ Soul Sync Data Storage ॥</h1>
            <p>Ancient Wisdom Records</p>
        </div>

        <div class="data-table">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>Date & Time</th>
                        <th>Name 1</th>
                        <th>Name 2</th>
                        <th>Gender</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data will be populated here -->
                </tbody>
            </table>
        </div>

        <div class="controls">
            <button onclick="clearData()">Clear All Data</button>
            <button onclick="exportData()">Export Data</button>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:3000';
        let currentEntries = [];

        async function displayData() {
            const tableBody = document.getElementById('tableBody');

            try {
                const response = await fetch(`${API_BASE_URL}/api/entries`);
                if (!response.ok) {
                    throw new Error('Failed to fetch records');
                }

                currentEntries = await response.json();
            } catch (error) {
                console.error('Error loading records:', error);
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="4" class="no-data">Could not load records. Start backend with: npm start</td>
                    </tr>
                `;
                return;
            }

            if (currentEntries.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="4" class="no-data">No records found</td>
                    </tr>
                `;
                return;
            }

            tableBody.innerHTML = currentEntries.map(entry => `
                <tr>
                    <td>${new Date(entry.timestamp).toLocaleString()}</td>
                    <td>${entry.name1}</td>
                    <td>${entry.name2}</td>
                    <td>${entry.gender}</td>
                </tr>
            `).join('');
        }

        async function clearData() {
            if (!confirm('Are you sure you want to clear all records?')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/api/entries`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    throw new Error('Failed to clear records');
                }

                await displayData();
            } catch (error) {
                console.error('Error clearing records:', error);
                alert('Failed to clear records. Ensure backend is running.');
            }
        }

        function exportData() {
            const blob = new Blob([JSON.stringify(currentEntries, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'soul-sync-data.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        displayData();
    </script>
</body>
</html>
